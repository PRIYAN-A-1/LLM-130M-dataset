model:
  context_length: 128
  embedding_dim: 128
  gradient_checkpointing: false
  mlp_dim: 512
  num_heads: 4
  num_layers: 4
  vocab_size: 512
training:
  batch_size: 2
  checkpoint_interval: 25
  eval_batches: 2
  eval_interval: 25
  gradient_accumulation_steps: 1
  log_interval: 10
  max_steps: 50
  precision: fp32
  sequence_length: 64
  warmup_steps: 5
