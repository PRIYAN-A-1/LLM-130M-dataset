[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "priyan-llm"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "tokenizers>=0.20", "PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30", "safetensors>=0.4"]
[project.scripts]
llm = "llm.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
